name: Technical Debt Risk Scoring

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run risk scoring pipeline
        run: python src/inference/github_scorer.py
          --repo-path .
          --output results/live/risk_report.csv

      - name: Upload risk report
        uses: actions/upload-artifact@v4
        with:
          name: risk-report
          path: results/live/risk_report.csv
